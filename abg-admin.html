<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABG Admin — Gestion des gammes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b4332">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8faf9;
    --panel: #ffffff;
    --panel-border: #e2e8f0;
    --green-primary: #1b4332;
    --green-accent: #2d6a4f;
    --green-light: #e8f5e9;
    --text-dark: #1f2937;
    --text-muted: #6b7280;
    --danger: #d32f2f;
    --ok: #2e7d32;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-dark);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  h1, h2, .brand-mark {
    font-family: 'Fraunces', serif;
  }

  /* ---------- Login screen ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    max-width: 360px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    border-radius: 8px;
    padding: 40px 32px;
    text-align: center;
  }

  .brand-mark {
    font-size: 28px;
    font-weight: 600;
    color: var(--green-primary);
    margin: 0 0 4px;
  }

  .login-sub {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  input[type="password"], input[type="text"], input[type="email"], textarea {
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--panel-border);
    color: var(--text-dark);
    padding: 11px 14px;
    border-radius: 6px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--green-accent);
  }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 11px 20px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-green {
    background: var(--green-primary);
    color: #ffffff;
  }
  .btn-green:hover {
    background: var(--green-accent);
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
  }
  .btn-ghost:hover {
    background: var(--bg);
    color: var(--text-dark);
  }

  .login-card form { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }

  #login-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-top: 10px;
  }

  #auth-checking {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ---------- App shell ---------- */
  #app-screen { display: none; min-height: 100vh; }

  header.topbar {
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
    gap: 16px;
  }

  .topbar h1 { font-size: 22px; color: var(--green-primary); margin: 0; font-weight: 600; }
  .topbar .header-right { display: flex; align-items: center; gap: 14px; }
  .topbar .user-email { font-size: 12px; color: var(--text-muted); }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 20px 28px 0;
    flex-wrap: wrap;
  }

  .tab {
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-muted);
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    text-transform: capitalize;
  }

  .tab.active {
    background: var(--green-primary);
    color: #ffffff;
    border-color: var(--green-primary);
  }

  main {
    padding: 24px 28px 60px;
    max-width: 760px;
  }

  #status-msg {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 18px;
    display: none;
  }
  #status-msg.show { display: block; }
  #status-msg.ok { background: var(--green-light); color: var(--ok); border: 1px solid var(--ok); }
  #status-msg.error { background: #ffebee; color: var(--danger); border: 1px solid var(--danger); }

  .product-count {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .product-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .field-row { margin-bottom: 12px; }
  .field-row label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  textarea { resize: vertical; min-height: 60px; font-size: 14px; }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }

  .doc-id {
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.7;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  #install-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--green-light);
    color: var(--green-primary);
    border: 1px solid var(--green-accent);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 20px 28px 0;
    font-size: 13px;
  }
  #install-banner.show { display: flex; }
  #install-banner button {
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    .field-grid { grid-template-columns: 1fr; }
    header.topbar, .tabs, main { padding-left: 18px; padding-right: 18px; }
    #install-banner { margin-left: 18px; margin-right: 18px; }
  }
</style>
</head>
<body>

<div id="auth-checking">Vérification de la session…</div>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <p class="brand-mark">ABG Admin</p>
    <p class="login-sub">Gestion des gammes Alkabir Coffee &amp; Honey</p>
    <form id="login-form">
      <input type="email" id="email-input" placeholder="Adresse email" autocomplete="username" required>
      <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="current-password" required>
      <button type="submit" class="btn btn-green" id="login-btn">Se connecter</button>
    </form>
    <p id="login-error"></p>
  </div>
</div>

<div id="app-screen">
  <header class="topbar">
    <h1>ABG — Gammes</h1>
    <div class="header-right">
      <span class="user-email" id="user-email-display"></span>
      <button class="btn btn-ghost logout" id="logout-btn">Se déconnecter</button>
    </div>
  </header>

  <div id="install-banner">
    <span>Installe cette page comme une application sur ton appareil pour y accéder plus vite.</span>
    <button class="btn btn-green" id="install-btn">Installer</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <main>
    <p id="status-msg"></p>
    <p class="product-count" id="product-count"></p>
    <div id="product-list"></div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9MQClwz8ky5qcYsUF0Lyu36T1c9Nc88w",
    authDomain: "al-kabir-business-general.firebaseapp.com",
    projectId: "al-kabir-business-general",
    storageBucket: "al-kabir-business-general.firebasestorage.app",
    messagingSenderId: "623528971549",
    appId: "1:623528971549:web:db5506270ea841dfa1a5f4",
    measurementId: "G-JLNR1YZWMT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authChecking = document.getElementById('auth-checking');
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  const userEmailDisplay = document.getElementById('user-email-display');
  const tabsEl = document.getElementById('tabs');
  const listEl = document.getElementById('product-list');
  const statusEl = document.getElementById('status-msg');
  const countEl = document.getElementById('product-count');

  let allProducts = [];
  let activeBrand = null;

  // ---------- Auth state ----------
  onAuthStateChanged(auth, (user) => {
    authChecking.style.display = 'none';
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      userEmailDisplay.textContent = user.email;
      loadProducts();
    } else {
      appScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
    }
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('password-input').value;
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion…';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      document.getElementById('password-input').value = '';
    } catch (err) {
      loginError.textContent = "Email ou mot de passe incorrect.";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Se connecter';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    signOut(auth);
  });

  // ---------- Data ----------
  async function loadProducts() {
    listEl.innerHTML = '<p class="empty-state">Chargement des gammes…</p>';
    countEl.textContent = '';
    try {
      const snap = await getDocs(collection(db, 'gammes'));
      allProducts = [];
      snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));

      if (allProducts.length === 0) {
        listEl.innerHTML = '<p class="empty-state">Aucun document trouvé dans la collection "gammes".</p>';
        return;
      }

      const brands = [...new Set(allProducts.map(p => (p.brand || 'autre').toLowerCase()))];
      activeBrand = brands[0] || null;
      renderTabs(brands);
      renderList();
    } catch (err) {
      listEl.innerHTML = '';
      showStatus("Erreur de chargement : " + err.message, 'error');
    }
  }

  function renderTabs(brands) {
    tabsEl.innerHTML = '';
    brands.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (b === activeBrand ? ' active' : '');
      btn.textContent = b;
      btn.addEventListener('click', () => {
        activeBrand = b;
        renderTabs(brands);
        renderList();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderList() {
    const items = allProducts
      .filter(p => (p.brand || 'autre').toLowerCase() === activeBrand)
      .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
    listEl.innerHTML = '';
    countEl.textContent = items.length + (items.length > 1 ? ' produits' : ' produit') + ' dans "' + activeBrand + '"';

    if (items.length === 0) {
      listEl.innerHTML = '<p class="empty-state">Aucune gamme pour cette marque.</p>';
      return;
    }

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="field-row">
          <label>Nom</label>
          <input type="text" data-field="name" value="${escapeHtml(item.name || '')}">
        </div>
        <div class="field-row">
          <label>Description</label>
          <textarea data-field="description">${escapeHtml(item.description || '')}</textarea>
        </div>
        <div class="field-grid">
          <div class="field-row">
            <label>Prix</label>
            <input type="text" data-field="price" value="${escapeHtml(item.price || '')}">
          </div>
          <div class="field-row">
            <label>Ordre d'affichage</label>
            <input type="text" data-field="order" value="${escapeHtml(item.order ?? '')}">
          </div>
        </div>
        <div class="card-footer">
          <span class="doc-id">ID: ${item.id}</span>
          <button class="btn btn-green save-btn">Enregistrer</button>
        </div>
      `;

      card.querySelector('.save-btn').addEventListener('click', () => saveItem(item.id, card));
      listEl.appendChild(card);
    });
  }

  async function saveItem(docId, card) {
    const name = card.querySelector('[data-field="name"]').value;
    const description = card.querySelector('[data-field="description"]').value;
    const price = card.querySelector('[data-field="price"]').value;
    const orderRaw = card.querySelector('[data-field="order"]').value;
    const order = orderRaw === '' ? '' : (isNaN(orderRaw) ? orderRaw : Number(orderRaw));

    try {
      await updateDoc(doc(db, 'gammes', docId), {
        name, description, price, order
      });
      const idx = allProducts.findIndex(p => p.id === docId);
      if (idx > -1) {
        allProducts[idx] = { ...allProducts[idx], name, description, price, order };
      }
      showStatus("Enregistré : " + name, 'ok');
    } catch (err) {
      showStatus("Erreur d'enregistrement : " + err.message, 'error');
    }
  }

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'show ' + type;
    setTimeout(() => { statusEl.className = ''; }, 3500);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- PWA install ----------
  let deferredPrompt = null;
  const installBanner = document.getElementById('install-banner');
  const installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.classList.add('show');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    installBanner.classList.remove('show');
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
